<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>LG Situation Room — NDC E-Situation Room 2027</title>
<link rel="stylesheet" href="/assets/css/theme.css">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/media/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/media/favicon-16.png">
<link rel="shortcut icon" href="/assets/media/favicon.ico">
<link rel="apple-touch-icon" href="/assets/media/apple-touch-icon.png">
</head>
<body>
<!-- EYES OF VICTORY preloader -->
<style>
#ev-preloader{position:fixed;inset:0;z-index:99999;background:radial-gradient(760px 480px at 50% 32%,#0d2440,#060a13);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .45s ease;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#ev-preloader.done{opacity:0;pointer-events:none}
.evp-radar{position:relative;width:150px;height:150px;margin-bottom:6px}
.evp-radar .r{position:absolute;border:1px solid rgba(56,189,248,.4);border-radius:50%;animation:evpring 2.4s ease-out infinite}
.evp-radar .r1{inset:0}.evp-radar .r2{inset:24px;animation-delay:.5s}.evp-radar .r3{inset:48px;animation-delay:1s}
.evp-radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(22,163,74,.5),transparent 70deg,transparent 360deg);animation:evpspin 3.2s linear infinite}
.evp-radar .core{position:absolute;inset:46px;border-radius:50%;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 2px #7dd3fc,0 0 30px rgba(56,189,248,.45)}
.evp-radar .core img{width:76%;height:76%;object-fit:contain}
@keyframes evpring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.2);opacity:0}}
@keyframes evpspin{to{transform:rotate(360deg)}}
.evp-brand{color:#fff;font-size:19px;font-weight:800;letter-spacing:2.5px}
.evp-brand small{display:block;text-align:center;font-size:9px;letter-spacing:3.5px;color:#8ba0bd;margin-top:4px;text-transform:uppercase}
.evp-status{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:#8ba0bd;min-width:230px;margin-top:6px}
.evp-status .srow{display:flex;align-items:center;gap:8px;opacity:0;animation:evpsrow .45s forwards}
.evp-status .srow .d{width:7px;height:7px;border-radius:50%;background:#f59e0b;animation:evpblink 1s infinite;flex:none}
.evp-status .srow.ok .d{background:#22c55e;animation:none}
.evp-status .srow span{letter-spacing:.6px}
@keyframes evpsrow{to{opacity:1}}
@keyframes evpblink{0%,100%{opacity:1}50%{opacity:.2}}
.evp-bar{width:230px;height:3px;background:#13223c;border-radius:3px;overflow:hidden;margin-top:8px}
.evp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#38bdf8);animation:evpfill 6.5s ease forwards;border-radius:3px}
@keyframes evpfill{0%{width:0}60%{width:64%}90%{width:88%}100%{width:100%}}
.evp-foot{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:1.6px;color:#40536f;text-transform:uppercase}
</style>
<div id="ev-preloader">
  <div class="evp-radar">
    <div class="r r1"></div><div class="r r2"></div><div class="r r3"></div>
    <div class="sweep"></div>
    <div class="core"><img src="/assets/media/logo.png" alt="EYES OF VICTORY"></div>
  </div>
  <div class="evp-brand">EYES OF VICTORY<small>LG SITUATION ROOM</small></div>
  <div class="evp-status">
    <div class="srow" style="animation-delay:.2s"><span class="d"></span><span>ESTABLISHING SECURE CONNECTION</span></div>
    <div class="srow" style="animation-delay:1.1s"><span class="d"></span><span>SYNCHRONIZING LOCATION</span></div>
    <div class="srow" style="animation-delay:2s"><span class="d"></span><span>VERIFYING DATA INTEGRITY</span></div>
  </div>
  <div class="evp-bar"><i></i></div>
  <div class="evp-foot">MONITOR · VERIFY · RESPOND · REPORT — KANO 2027</div>
</div>
<script>
(function(){
  var el=document.getElementById('ev-preloader');
  window.__evHidePreloader=function(){ if(!el) return; el.classList.add('done'); setTimeout(function(){ el&&el.remove(); },500); };
  // mark status rows complete progressively
  setTimeout(function(){var rs=document.querySelectorAll('#ev-preloader .srow');if(rs[0])rs[0].classList.add('ok');},1500);
  setTimeout(function(){var rs=document.querySelectorAll('#ev-preloader .srow');if(rs[1])rs[1].classList.add('ok');},2400);
  setTimeout(function(){var rs=document.querySelectorAll('#ev-preloader .srow');if(rs[2])rs[2].classList.add('ok');},3300);
  // failsafe — never block the app
  setTimeout(function(){ if(el && !el.classList.contains('done')) window.__evHidePreloader(); },8000);
  // auto-hide as soon as the app shell paints
  new MutationObserver(function(){
    if(document.querySelector('.app,.login-wrap,.agent-host,.pub-header,.land,.doc')) window.__evHidePreloader();
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>
<script src="/assets/js/util.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/map.js"></script>
<script src="/assets/js/pages/lg.js"></script>
</body>
</html>
